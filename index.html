<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Responsive -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <!-- Primary SEO -->
    <title>Bernard Otabor | Frontend Developer</title>

    <meta
      name="description"
      content="Bernard Otabor is a frontend developer creating modern, responsive, and user-friendly web experiences."
    />

    <meta
      name="keywords"
      content="Bernard Otabor, frontend developer, web developer, React developer, JavaScript developer, portfolio"
    />

    <meta name="author" content="Bernard Otabor" />

    <!-- Search engine behavior -->
    <meta
      name="robots"
      content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1"
    />

    <!-- Canonical URL -->
    <link
      rel="canonical"
      href="https://yourdomain.com/"
    />

    

    <!-- Theme -->
    <meta name="theme-color" content="#0b1120" />

    <!-- =========================
         OPEN GRAPH
    ========================== -->

    <meta property="og:type" content="website" />

    <meta
      property="og:title"
      content="Bernard Otabor | Frontend Developer"
    />

    <meta
      property="og:description"
      content="Frontend developer creating modern, responsive, and user-friendly web experiences."
    />

    <meta
      property="og:url"
      content="https://yourdomain.com/"
    />

    <meta
      property="og:site_name"
      content="Bernard Otabor Portfolio"
    />

    <meta
      property="og:image"
      content="https://yourdomain.com/og-image.png"
    />

    <meta
      property="og:image:alt"
      content="Bernard Otabor portfolio"
    />

    <!-- Recommended OG image dimensions -->
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- =========================
         TWITTER / X
    ========================== -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta
      name="twitter:title"
      content="Bernard Otabor | Frontend Developer"
    />

    <meta
      name="twitter:description"
      content="Frontend developer creating modern, responsive, and user-friendly web experiences."
    />

    <meta
      name="twitter:image"
      content="https://yourdomain.com/og-image.png"
    />

    <meta
      name="twitter:image:alt"
      content="Bernard Otabor portfolio"
    />

    <!-- =========================
         FAVICON
    ========================== -->
    <link rel="apple-touch-icon" sizes="180x180" href="../apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="../favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="../favicon-16x16.png">
    <link rel="manifest" href="../site.webmanifest">

    <link rel="icon" type="image/png" href="../favicon.png" />

    <!-- Apple devices -->
    <link
      rel="apple-touch-icon"
      href="../apple-touch-icon.png"
    />

    <!-- =========================
         FONTS
    ========================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"

    <link
